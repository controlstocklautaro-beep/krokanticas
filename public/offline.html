<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241b17" />
    <title>Sin conexión · Krokanticas</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#2d211b;background:#faf7f1;font-family:Arial,sans-serif}.card{width:min(430px,100%);padding:34px;border:1px solid #e5d8c6;border-radius:20px;background:#fff;box-shadow:0 18px 60px #4a321712;text-align:center}.mark{width:72px;height:72px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;color:#fff9f1;background:#c45d1c;font:700 44px Georgia,serif}h1{margin:0 0 12px;font:700 30px Georgia,serif}p{margin:0;color:#786b62;font-size:15px;line-height:1.55}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:11px;color:#fff;background:#b85416;font-size:15px;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">K</div>
      <h1>Estás sin conexión</h1>
      <p>Cuando vuelva internet, tocá el botón para recuperar el panel y actualizar pedidos, cocina y stock.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
